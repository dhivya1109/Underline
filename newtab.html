<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <style>
    /* Inline so the first paint is already the right colour — no flash */
    html { background: #121110; }
    html[data-theme="light"] { background: #f3efe6; }
  </style>
  <script src="theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div class="grain"></div>
  <div class="mark mark-top" aria-hidden="true">“</div>
  <div class="mark mark-bottom" aria-hidden="true">”</div>

  <header class="bar">
    <span class="wordmark">Underline<span class="dot"></span></span>
  </header>

  <main>
    <p id="quote"></p>
  </main>

  <!-- Who sent it, bottom left next to the theme switch -->
  <p id="by"></p>

  <!-- Bottom left corner, with the name beside it -->
  <button id="theme" class="tool icon theme-toggle bottom-left" type="button" aria-label="Switch between light and dark">
    <svg class="to-light" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <svg class="to-dark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
  </button>

  <script src="config.js"></script>
  <script src="editor.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
