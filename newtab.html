<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <style>
    /* Inline so the first paint is already the right colour — no flash */
    html { background: #121110; }
    html[data-theme="light"] { background: #f3efe6; }
  </style>
  <script src="theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div class="grain"></div>
  <div class="mark mark-top" aria-hidden="true">“</div>
  <div class="mark mark-bottom" aria-hidden="true">”</div>

  <header class="bar">
    <span class="wordmark">Underline<span class="dot"></span></span>
  </header>

  <main>
    <p id="quote"></p>
  </main>

  <!-- Who sent it, bottom left -->
  <p id="by"></p>

  <script src="config.js"></script>
  <script src="editor.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
