<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Underline — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1><span class="u">Underline</span></h1>
    <p class="lede">Set this up once. After that, select any line while you read and press
      <kbd id="shortcut">Alt+Shift+U</kbd>, click the toolbar icon, or right-click &rarr; Underline.</p>

    <form id="form" autocomplete="off">
      <section>
        <h2>You</h2>
        <label>
          <span>Name</span>
          <input id="name" type="text" placeholder="How you'll be credited" />
        </label>
        <label>
          <span>Social link <em>optional</em></span>
          <input id="socialLink" type="url" placeholder="https://…" />
        </label>
      </section>

      <section>
        <h2>Your sheet</h2>
        <label>
          <span>Web app URL</span>
          <input id="endpoint" type="url" required placeholder="https://script.google.com/macros/s/…/exec" />
        </label>
        <label>
          <span>Secret</span>
          <input id="secret" type="password" required placeholder="Same value as SECRET in the Apps Script" />
        </label>
      </section>

      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" id="test" class="ghost">Test connection</button>
        <span id="status" role="status"></span>
      </div>
    </form>

    <section id="pending-box" hidden>
      <h2>Waiting to sync</h2>
      <p><span id="pending-count"></span> saved while offline.
        <button type="button" id="retry" class="link">Sync now</button></p>
    </section>

    <p class="foot"><button type="button" id="shortcuts" class="link">Change the keyboard shortcut</button></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
